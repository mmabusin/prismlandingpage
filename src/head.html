/* Decided before anything paints: the theme the visitor chose here or on the rankings pages (one key

  try { var t = localStorage.getItem('prism_site_theme'); if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); } catch (e) {}

})();
