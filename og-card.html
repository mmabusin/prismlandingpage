<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--accent:#2563EB;--text:#000;--dim:#525252;--muted:#737373;--border:#e5e5e5;
        --spectrum:linear-gradient(90deg,#2563EB 0%,#4f46e5 22%,#06b6d4 45%,#10b981 68%,#f59e0b 88%,#ef4444 100%)}
  body{width:1200px;height:630px;background:#fff;font-family:'Inter',sans-serif;color:var(--text);
       padding:64px 72px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-name{font-family:'Nunito',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.025em}
  .brand-dot{color:var(--accent)}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;margin-top:44px;align-self:flex-start;
           font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;letter-spacing:.1em;
           text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:9999px;
           padding:8px 16px;background:#fafafa}
  .eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:block}
  h1{font-family:'Nunito',sans-serif;font-weight:800;font-size:68px;line-height:1.04;letter-spacing:-.03em;
     margin-top:26px;max-width:15ch}
  h1 span{color:var(--accent)}
  p{font-size:23px;color:var(--dim);margin-top:22px;max-width:44ch;line-height:1.45}
  p b{color:var(--text);font-weight:600}
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;
        font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .rule{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--spectrum)}
</style></head>
<body>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 28 28">
      <line x1="4" y1="6" x2="4" y2="22" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="24" y1="6" x2="24" y2="22" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="4" y1="6" x2="24" y2="6" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="4" y1="22" x2="24" y2="22" stroke="#000" stroke-width="1.2" opacity=".4"/>
      <line x1="9" y1="6" x2="9" y2="22" stroke="#000" stroke-width=".8" opacity=".4"/>
      <line x1="14" y1="6" x2="14" y2="22" stroke="#000" stroke-width=".8" opacity=".4"/>
      <line x1="19" y1="6" x2="19" y2="22" stroke="#000" stroke-width=".8" opacity=".4"/>
      <line x1="4" y1="11" x2="24" y2="11" stroke="#000" stroke-width=".8" opacity=".4"/>
      <line x1="4" y1="16" x2="24" y2="16" stroke="#000" stroke-width=".8" opacity=".4"/>
      <circle cx="14" cy="16" r="3" fill="#2563EB"/>
    </svg>
    <span class="brand-name">The Prism<span class="brand-dot">.</span></span>
  </div>
  <span class="eyebrow"><i></i> Private beta · Europe's top five leagues</span>
  <h1>Enterprise-level football analysis, <span>for everyone.</span></h1>
  <p><b>AI-powered football intelligence at your fingertips.</b> Ask it anything in natural language.</p>
  <div class="foot"><span>theprismai.com</span><span>Live data · Premier League · La Liga · Serie A · Bundesliga · Ligue 1</span></div>
  <div class="rule"></div>
</body></html>
